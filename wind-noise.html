<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f151c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Wind noise">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Wind Noise Report</title>
<link rel="manifest" href="wind-noise.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b5cad'/%3E%3Cpath d='M18 46h28M24 46l4-28h8l4 28M27 30h10' stroke='white' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    --bg: #f3f5f8; --surface: #ffffff; --fg: #16202c; --muted: #5b6878; --line: #d9dfe7;
    --accent: #0b5cad; --accent-bg: #e6f0fb; --warn: #b42318;
    --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f151c; --surface: #18212b; --fg: #e6ecf2; --muted: #93a1b2; --line: #2a3644;
      --accent: #6fb1f5; --accent-bg: #17304a; --warn: #ff8a80;
      color-scheme: dark;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.35; }
  .wrap {
    max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
    padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .back {
    align-self: flex-start; display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px;
    border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
    color: var(--fg); text-decoration: none; font-weight: 700; font-size: 0.85rem;
  }
  .back[hidden] { display: none; }
  h1 { margin: 0; font-size: 1.25rem; }
  .note { margin: 0; color: var(--muted); font-size: 0.9rem; }
  form { display: flex; flex-direction: column; gap: 12px; }
  fieldset, .field {
    margin: 0; padding: 10px 12px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
    display: flex; flex-direction: column; gap: 8px; min-width: 0;
  }
  legend, .field > label, .sub { padding: 0; font-weight: 700; font-size: 0.92rem; }
  legend { float: left; width: 100%; margin-bottom: 8px; }
  legend + * { clear: both; }
  .sub { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
  .hint { font-weight: 400; color: var(--muted); font-size: 0.82rem; }
  input, textarea {
    font: inherit; font-size: 1rem; width: 100%; box-sizing: border-box; min-height: 46px; padding: 8px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg);
  }
  textarea { min-height: 84px; resize: vertical; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .mono { font-family: var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > input { flex: 1; min-width: 0; }
  .unit-suffix { font-weight: 700; color: var(--muted); }
  .chips { display: grid; gap: 6px; }
  .chips.two { grid-template-columns: 1fr 1fr; }
  .chips.units { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .chip {
    font: inherit; font-weight: 700; cursor: pointer; min-height: 46px; padding: 0 4px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  .chip.mono { font-size: 0.9rem; letter-spacing: 0.02em; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .prefixes { display: flex; gap: 6px; }
  .prefixes .chip { min-width: 58px; }
  .picked { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
  .unit-name { font-family: var(--font-mono); }
  .error { color: var(--warn); font-size: 0.85rem; font-weight: 700; }
  .error:empty { display: none; }
  .invalid { border-color: var(--warn); }
  .send, .unlock button {
    font: inherit; font-weight: 700; font-size: 1.05rem; cursor: pointer; min-height: 54px; border: 0; border-radius: 12px;
    background: var(--accent); color: var(--bg);
  }
  .secondary {
    font: inherit; font-weight: 700; font-size: 0.9rem; cursor: pointer; min-height: 44px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  }
  .after { display: flex; flex-direction: column; gap: 8px; }
  .after[hidden] { display: none; }
  pre {
    margin: 0; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; font-family: var(--font-body); font-size: 0.85rem;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  }
  .unlock { display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" id="back" href="./" hidden>← Shortcuts</a>
  <h1>🌬️ 360 cab door wind noise</h1>
  <div id="app"><p class="note">Loading…</p></div>
</div>

<template id="form-tpl">
<form id="form" novalidate>
  <div class="field">
    <label for="date">Date</label>
    <input type="date" id="date" required>
  </div>

  <div class="field">
    <label for="headcode">Headcode <span class="hint">4 characters, e.g. 1Y01</span></label>
    <div class="row">
      <div class="prefixes">
        <button type="button" class="chip mono" data-prefix="1Y">1Y</button>
        <button type="button" class="chip mono" data-prefix="1H">1H</button>
      </div>
      <input id="headcode" class="mono" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="1Y01" required>
    </div>
    <div class="error" id="headcode-err"></div>
  </div>

  <fieldset>
    <legend>Unit <span class="hint">360…, pick one or two</span></legend>
    <div class="chips units" id="units"></div>
    <div class="picked" id="units-picked"></div>
    <div class="error" id="units-err"></div>
  </fieldset>

  <div id="faults" style="display:contents"></div>

  <div class="field">
    <label for="speed">Excessive above</label>
    <div class="row">
      <input id="speed" type="number" inputmode="numeric" min="1" max="125" step="1" placeholder="80" required>
      <span class="unit-suffix">mph</span>
    </div>
    <div class="error" id="speed-err"></div>
  </div>

  <div class="field">
    <label for="name">Name <span class="hint">optional</span></label>
    <input id="name" autocomplete="name">
    <label for="role">Role <span class="hint">optional</span></label>
    <input id="role">
    <label for="pay">Pay number <span class="hint">optional</span></label>
    <input id="pay" autocomplete="off">
  </div>

  <div class="field">
    <label for="notes">Notes <span class="hint">optional</span></label>
    <textarea id="notes"></textarea>
  </div>

  <button type="submit" class="send">✉️ Create email</button>
  <div class="after" id="after" hidden>
    <p class="note">Your mail app should open with the email ready to send. If it didn't, copy the text below and paste it into an email.</p>
    <pre id="preview"></pre>
    <button type="button" class="secondary" id="copy">Copy email text</button>
  </div>
</form>
</template>

<script>
  // The To and CC addresses are kept encrypted so they never appear in the public repo.
  // Tom's phone reads them from his unlocked shortcuts (links.enc.json → reports.windNoise).
  // Anyone else unlocks report.enc.json once with the form's own shared password.
  const app = document.getElementById("app");
  const SHORTCUTS_KEY = "shortcuts-key";
  const FORM_KEY = "wind-noise-key";
  const LAST_STORE = "wind-noise-last";
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const load = (url) => fetch(url).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });

  async function decrypt(file, key) {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(file.iv) }, key, unb64(file.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  const importKey = (raw) => crypto.subtle.importKey("raw", unb64(raw), "AES-GCM", true, ["decrypt"]);

  async function fromShortcuts() {
    const raw = store.get(SHORTCUTS_KEY);
    if (!raw) return null;
    try { return (await decrypt(await load("links.enc.json"), await importKey(raw))).reports?.windNoise || null; }
    catch (e) { return null; }
  }

  async function fromFormFile(file) {
    const raw = store.get(FORM_KEY);
    if (!raw) return null;
    try { return (await decrypt(file, await importKey(raw))).windNoise || null; }
    catch (e) { return null; }
  }

  function askPassword(file, wrong) {
    const form = document.createElement("form");
    form.className = "unlock";
    form.innerHTML =
      '<div class="field"><label for="password">Password</label>' +
      '<input type="password" id="password" autocomplete="current-password" required>' +
      '<p class="note"></p></div><button type="submit">Unlock</button>';
    const msg = form.querySelector(".note");
    msg.textContent = wrong ? "That password didn't work. Try again." : "Enter the form's password once to unlock it on this phone. Ask the driver who shared the link.";
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = form.querySelector("button");
      btn.disabled = true;
      msg.textContent = "Unlocking…";
      try {
        const base = await crypto.subtle.importKey("raw", new TextEncoder().encode($("password").value), "PBKDF2", false, ["deriveKey"]);
        const key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", hash: "SHA-256", salt: unb64(file.salt), iterations: file.iterations },
          base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]
        );
        const to = (await decrypt(file, key)).windNoise;
        store.set(FORM_KEY, b64(await crypto.subtle.exportKey("raw", key)));
        start(to);
      } catch (err) {
        askPassword(file, true);
      }
    });
    app.replaceChildren(form);
  }

  // Toggle buttons. max limits how many can be picked at once; picked keeps the choices.
  function toggles(box, values, picked, max, onChange) {
    const sync = () => { for (const c of box.children) c.setAttribute("aria-pressed", String(picked.includes(c.dataset.v))); };
    for (const v of values) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip mono";
      b.textContent = v;
      b.dataset.v = v;
      b.addEventListener("click", () => {
        const i = picked.indexOf(v);
        if (i >= 0) picked.splice(i, 1);
        else {
          if (max && picked.length >= max) picked.shift();
          picked.push(v);
        }
        picked.sort();
        sync();
        onChange && onChange();
      });
      box.append(b);
    }
    sync();
  }

  const today = () => {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  };
  const longDate = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const shortDate = (iso) => iso.split("-").reverse().join("/");
  const both = (list) => list.join(" and ");

  function start(to) {
    app.replaceChildren($("form-tpl").content.cloneNode(true));
    const UNITS = Array.from({ length: 21 }, (_, i) => String(101 + i));
    const units = [];
    // Cab and door choices for each unit, kept if a unit is deselected and picked again.
    const faults = {};

    function renderFaults() {
      $("units-picked").textContent = units.length ? units.map((u) => "360" + u).join(" + ") : "";
      $("units-err").textContent = "";
      $("faults").replaceChildren(...units.map((u) => {
        const f = faults[u] || (faults[u] = { cabs: [], doors: [] });
        const set = document.createElement("fieldset");
        const legend = document.createElement("legend");
        legend.innerHTML = 'Cab and door on <span class="unit-name"></span> <span class="hint">one or both of each</span>';
        legend.querySelector(".unit-name").textContent = "360" + u;
        const cabLabel = Object.assign(document.createElement("div"), { className: "sub", textContent: "Cab" });
        const cabs = Object.assign(document.createElement("div"), { className: "chips two" });
        const doorLabel = Object.assign(document.createElement("div"), { className: "sub", textContent: "Door" });
        const doors = Object.assign(document.createElement("div"), { className: "chips two" });
        const err = Object.assign(document.createElement("div"), { className: "error", id: "fault-err-" + u });
        toggles(cabs, ["DMC1", "DMC2"], f.cabs, 0, () => { err.textContent = ""; });
        toggles(doors, ["E1", "F1"], f.doors, 0, () => { err.textContent = ""; });
        set.append(legend, cabLabel, cabs, doorLabel, doors, err);
        return set;
      }));
    }
    toggles($("units"), UNITS, units, 2, renderFaults);

    $("date").value = today();

    const hc = $("headcode");
    hc.addEventListener("input", () => {
      hc.value = hc.value.toUpperCase().replace(/[^0-9A-Z]/g, "").slice(0, 4);
      hc.classList.remove("invalid"); $("headcode-err").textContent = "";
    });
    for (const b of document.querySelectorAll("[data-prefix]")) {
      b.addEventListener("click", () => { hc.value = b.dataset.prefix; hc.focus(); hc.setSelectionRange(2, 2); });
    }
    $("speed").addEventListener("input", () => { $("speed").classList.remove("invalid"); $("speed-err").textContent = ""; });

    // Speed, name, role, pay number and notes come back from the last report sent from this phone.
    let last = {};
    try { last = JSON.parse(store.get(LAST_STORE)) || {}; } catch (e) {}
    for (const f of ["speed", "name", "role", "pay", "notes"]) if (last[f]) $(f).value = last[f];

    function check() {
      let ok = true;
      const fail = (id, msg, input) => {
        $(id).textContent = msg;
        if (input) input.classList.add("invalid");
        if (ok) (input || $(id)).scrollIntoView({ block: "center" });
        ok = false;
      };
      for (const i of document.querySelectorAll(".invalid")) i.classList.remove("invalid");
      if (!/^[0-9A-Z]{4}$/.test(hc.value)) fail("headcode-err", "Enter all 4 characters of the headcode.", hc);
      if (!units.length) fail("units-err", "Pick at least one unit.");
      for (const u of units) {
        const f = faults[u];
        if (!f.cabs.length || !f.doors.length) fail("fault-err-" + u, "Pick the cab and the door on 360" + u + ".");
      }
      if (!(Number($("speed").value) > 0)) fail("speed-err", "Enter the speed in mph.", $("speed"));
      if (!$("date").value) $("date").value = today();
      return ok;
    }

    function email() {
      const unitText = units.map((u) => "360" + u).join(" + ");
      const v = (id) => $(id).value.trim();
      const subject = "Class 360 cab door wind noise - " + hc.value + " - " + unitText + " - " + shortDate(v("date"));
      const lines = [
        "Hello Maintenance Control,",
        "",
        "Please could you log the following report of excessive wind noise from a cab door.",
        "",
        "Date: " + longDate(v("date")),
        "Headcode: " + hc.value,
      ];
      for (const u of units) {
        const f = faults[u];
        lines.push("Unit 360" + u + ": cab " + both(f.cabs) + ", door " + both(f.doors));
      }
      lines.push("Wind noise excessive above: " + v("speed") + " mph");
      if (v("notes")) lines.push("", "Notes:", v("notes"));
      lines.push("", "Thanks,");
      if (v("name")) lines.push(v("name"));
      if (v("role")) lines.push(v("role"));
      if (v("pay")) lines.push("Pay number: " + v("pay"));
      return { subject, body: lines.join("\n") };
    }

    $("form").addEventListener("submit", (e) => {
      e.preventDefault();
      for (const n of document.querySelectorAll(".error")) n.textContent = "";
      if (!check()) return;
      const saved = {};
      for (const f of ["speed", "name", "role", "pay", "notes"]) saved[f] = $(f).value.trim();
      store.set(LAST_STORE, JSON.stringify(saved));
      const { subject, body } = email();
      const enc = (s) => encodeURIComponent(s).replace(/%0A/g, "%0D%0A");
      const params = (to.cc ? "cc=" + encodeURIComponent(to.cc) + "&" : "") + "subject=" + enc(subject) + "&body=" + enc(body);
      $("preview").textContent = "To: " + to.to + (to.cc ? "\nCC: " + to.cc : "") + "\nSubject: " + subject + "\n\n" + body;
      $("after").hidden = false;
      $("copy").onclick = async () => {
        try { await navigator.clipboard.writeText($("preview").textContent); $("copy").textContent = "Copied ✓"; }
        catch (err) { $("copy").textContent = "Couldn't copy: press and hold the text instead"; }
      };
      location.href = "mailto:" + to.to + "?" + params;
    });
  }

  (async () => {
    // Only show the way back to the shortcuts on a phone that has them unlocked.
    $("back").hidden = !store.get(SHORTCUTS_KEY);
    let to = await fromShortcuts();
    if (to && to.to) return start(to);
    let file;
    try { file = await load("report.enc.json"); }
    catch (e) { app.innerHTML = '<p class="note">Couldn\'t load the form. Check your connection and try again.</p>'; return; }
    to = await fromFormFile(file);
    if (to && to.to) start(to);
    else askPassword(file, false);
  })();

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
