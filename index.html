<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f151c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Shortcuts">
<title>Work Shortcuts</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b5cad'/%3E%3Cpath d='M18 46h28M24 46l4-28h8l4 28M27 30h10' stroke='white' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Layout: sticky section shortcuts; stations as one table with a column per kind of link; contacts and links as two-up cards; a floating star button bottom right opens quick links */
  :root {
    --bg: #f3f5f8;
    --surface: #ffffff;
    --fg: #16202c;
    --muted: #5b6878;
    --line: #d9dfe7;
    --accent: #0b5cad;
    --dep: #0b5cad;   --dep-bg: #e6f0fb;
    --map: #1f7a3f;   --map-bg: #e5f4ea;
    --board: #9a5b00; --board-bg: #fdf1dc;
    --tl: #a3195b;    --tl-bg: #fbe6f0;
    --link: #4a5565;  --link-bg: #eef1f5;
    --call: #0f766e;  --call-bg: #e0f3f1;
    --mail: #6d3fc0;  --mail-bg: #efe8fb;
    --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f151c; --surface: #18212b; --fg: #e6ecf2; --muted: #93a1b2; --line: #2a3644; --accent: #6fb1f5;
      --dep: #8cc2fa;   --dep-bg: #17304a;
      --map: #7fd69c;   --map-bg: #173826;
      --board: #f5c46b; --board-bg: #3a2c12;
      --tl: #f59ac4;    --tl-bg: #3d1a2b;
      --link: #c3cdd8;  --link-bg: #243140;
      --call: #6fd6c8;  --call-bg: #133532;
      --mail: #c4a8f5;  --mail-bg: #2c2142;
      color-scheme: dark;
    }
  }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 15px; line-height: 1.3;
  }
  .wrap {
    max-width: 760px; margin: 0 auto;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 14px;
  }
  h1 { margin: 0; font-size: 1.2rem; }
  h2 { margin: 0; font-size: 0.82rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg); display: flex; align-items: center; gap: 8px; }
  h2 .emoji { font-size: 1.1rem; letter-spacing: 0; }
  #main { display: flex; flex-direction: column; gap: 18px; }
  .badge {
    font-family: var(--font-mono); font-size: 0.66rem; font-weight: 700; letter-spacing: 0.04em;
    padding: 2px 5px; border-radius: 5px; background: var(--link-bg); color: var(--muted);
  }
  .code { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.02em; color: var(--muted); }

  /* Stations: one table, a column per kind of link, so every button sits in the same place */
  .table { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 2px 8px; }
  .trow { display: grid; grid-template-columns: minmax(0, 1fr) repeat(var(--cols), 3.5em); gap: 5px; align-items: center; padding: 5px 0; }
  .trow + .trow { border-top: 1px solid var(--line); }
  .thead { padding: 6px 0 4px; }
  .thead span { text-align: center; font-size: 0.6rem; font-weight: 700; color: var(--c); line-height: 1.1; }
  .sname { min-width: 0; display: flex; flex-direction: column; }
  .sname strong { font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a.btn.cell { justify-content: center; padding: 0 4px; min-height: 38px; width: 100%; box-sizing: border-box; }
  a.btn.cell .dest { font-family: var(--font-mono); font-size: 0.68rem; }

  /* Contacts and links: two-up cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .card {
    min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  }
  .card-head { display: flex; gap: 6px; align-items: flex-start; }
  .card-head .mark { font-size: 1.1rem; line-height: 1.2; }
  .card-head strong { display: block; font-size: 0.88rem; line-height: 1.25; }
  .card .links { display: flex; flex-wrap: wrap; gap: 4px; }
  .card .links a.btn { flex: 1 1 auto; justify-content: center; padding: 0 8px; }
  a.btn.tile { white-space: normal; min-height: 48px; padding: 8px 10px; gap: 8px; font-size: 0.85rem; line-height: 1.2; }
  a.btn.tile .mark { font-size: 1.1rem; }
  a.btn {
    display: inline-flex; align-items: center; gap: 5px; min-height: 36px; padding: 0 9px;
    border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 0.85rem; white-space: nowrap;
    color: var(--c); background: var(--cb); border: 1px solid transparent;
  }
  a.btn:hover { border-color: var(--c); }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  a.btn svg { width: 16px; height: 16px; flex: none; }
  .t-departures { --c: var(--dep); --cb: var(--dep-bg); }
  .t-map { --c: var(--map); --cb: var(--map-bg); }
  .t-board { --c: var(--board); --cb: var(--board-bg); }
  .t-thameslink { --c: var(--tl); --cb: var(--tl-bg); }
  .t-link { --c: var(--link); --cb: var(--link-bg); }
  .t-call, .t-text { --c: var(--call); --cb: var(--call-bg); }
  .t-email { --c: var(--mail); --cb: var(--mail-bg); }
  .group { display: flex; flex-direction: column; gap: 8px; }
  .note { margin: 0; color: var(--muted); }
  a.btn { -webkit-touch-callout: none; }

  /* Section shortcuts */
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .jump {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; gap: 6px; overflow-x: auto;
    margin: 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
    padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
    background: var(--bg); border-bottom: 1px solid var(--line); scrollbar-width: none;
  }
  .jump::-webkit-scrollbar { display: none; }
  .jump a {
    flex: none; display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 0 10px;
    border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
    color: var(--fg); text-decoration: none; font-size: 0.8rem; font-weight: 700; white-space: nowrap;
  }
  #main { padding-bottom: 80px; }
  .group { scroll-margin-top: calc(60px + env(safe-area-inset-top, 0px)); }

  /* Starred links: floating button bottom right that opens a list */
  .quick {
    position: fixed; z-index: 8; display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    max-width: calc(100vw - 28px);
  }
  .fab {
    font: inherit; cursor: pointer; width: 58px; height: 58px; border-radius: 50%; border: 0;
    background: var(--accent); color: var(--bg); font-size: 1.6rem; line-height: 1; box-shadow: 0 4px 14px rgb(0 0 0 / 0.28);
  }
  .fab.done { width: auto; padding: 0 18px; border-radius: 999px; font-size: 0.95rem; font-weight: 700; }
  .fab:focus-visible, .sheet button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  .sheet {
    display: flex; flex-direction: column; align-items: stretch; gap: 6px; width: min(270px, calc(100vw - 28px));
    padding: 10px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 8px 24px rgb(0 0 0 / 0.25);
  }
  .sheet h3 { margin: 0 0 2px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .sheet a.btn { min-height: 46px; padding: 0 12px; font-size: 0.92rem; }
  .sheet a.btn .star { margin-left: auto; font-size: 0.8rem; }
  .sheet .note { font-size: 0.85rem; }
  .sheet .star-mode {
    font: inherit; font-size: 0.85rem; font-weight: 700; cursor: pointer; min-height: 40px; margin-top: 2px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  .pin-help {
    margin: 0; max-width: 15em; text-align: right; font-weight: 700; font-size: 0.8rem; padding: 6px 10px;
    border-radius: 8px; background: var(--accent); color: var(--bg); box-shadow: 0 2px 8px rgb(0 0 0 / 0.18);
  }
  .pinning #main a.btn { position: relative; border: 1px dashed var(--c); }
  .pinning #main a.btn::after {
    content: "☆"; position: absolute; top: -7px; right: -6px; width: 18px; height: 18px; border-radius: 50%;
    display: grid; place-items: center; font-size: 0.7rem; background: var(--surface); color: var(--muted); border: 1px solid var(--line);
  }
  .pinning #main a.btn.pinned::after { content: "★"; color: var(--board); border-color: var(--board); }
  .unlock { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; max-width: 360px; }
  .unlock label { width: 100%; font-weight: 700; }
  .unlock input {
    flex: 1; min-width: 0; font: inherit; min-height: 40px; padding: 0 10px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg);
  }
  .unlock button {
    font: inherit; font-weight: 700; min-height: 40px; padding: 0 16px; cursor: pointer;
    border: 0; border-radius: 8px; background: var(--accent); color: var(--bg);
  }
  .unlock input:focus-visible, .unlock button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .unlock .note { width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Work Shortcuts</h1>
  <nav class="jump" id="jump" aria-label="Jump to section" hidden></nav>
  <main id="main"><p class="note">Loading…</p></main>
</div>
<nav class="quick" id="quick" aria-label="Quick links" hidden></nav>

<script>
  // Stations, contacts and links come from links.enc.json. Links open in the same tab, so Back returns here.
  const root = document.getElementById("main");

  // Each link "type" gets its own colour, icon and default label.
  const TYPES = {
    departures: { label: "Departures", icon: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>' },
    map: { label: "Map", icon: '<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>' },
    board: { label: "Board", icon: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h10M7 14h6"/>' },
    thameslink: { label: "Thameslink", icon: '<path d="M5 12h14M13 6l6 6-6 6"/>' },
    call: { label: "Call", icon: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>' },
    text: { label: "Text", icon: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>' },
    email: { label: "Email", icon: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>' },
    link: { label: "Link", icon: '<path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1"/><path d="M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/>' },
  };

  function el(tag, className, text) {
    const n = document.createElement(tag);
    if (className) n.className = className;
    if (text) n.textContent = text;
    return n;
  }

  function button(link, quickLabel) {
    const type = TYPES[link.type] ? link.type : "link";
    const a = el("a", "btn t-" + type);
    a.href = link.url;
    a.dataset.type = type;
    a.dataset.quick = quickLabel || link.label || TYPES[type].label;
    a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + TYPES[type].icon + "</svg>";
    a.append(link.label || TYPES[type].label);
    return a;
  }

  const tel = (n) => n.replace(/[^0-9+]/g, "");

  function cardHead(mark, title, detail) {
    const head = el("div", "card-head");
    const text = el("div");
    text.append(el("strong", "", title));
    if (detail) text.append(el("span", "code", detail));
    head.append(el("span", "mark", mark || ""), text);
    return head;
  }

  function section(icon, title, body) {
    const group = el("div", "group");
    group.id = "s-" + title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    group.dataset.icon = icon || "";
    group.dataset.title = title;
    const h = el("h2");
    if (icon) h.append(el("span", "emoji", icon));
    h.append(title);
    group.append(h, body);
    return group;
  }

  // The kinds of station link, in column order; only kinds that are used get a column.
  const COLUMNS = ["departures", "map", "board", "thameslink"];
  const HEADS = { departures: "Departures", map: "Map", board: "Board", thameslink: "Thameslink" };

  function stationsView(data) {
    const locs = data.locations || [];
    const used = [...new Set(locs.flatMap((l) => l.links.map((x) => x.type)))];
    const all = [...COLUMNS.filter((t) => used.includes(t)), ...used.filter((t) => !COLUMNS.includes(t))];
    const table = el("div", "table");
    table.style.setProperty("--cols", all.length);
    const head = el("div", "trow thead");
    head.append(el("span"), ...all.map((t) => el("span", "t-" + (TYPES[t] ? t : "link"), HEADS[t] || "Link")));
    table.append(head);
    for (const loc of locs) {
      const r = el("div", "trow");
      const name = el("div", "sname");
      name.append(el("strong", "", loc.name));
      if (loc.code) name.append(el("span", "code", loc.code));
      r.append(name);
      for (const t of all) {
        const l = loc.links.find((x) => x.type === t);
        if (!l) { r.append(el("span")); continue; }
        const label = l.label || TYPES[t]?.label || "Link";
        const a = button(l, loc.code + " " + label);
        a.classList.add("cell");
        a.setAttribute("aria-label", loc.name + " " + label);
        a.lastChild.remove();
        if (t === "thameslink") a.append(el("span", "dest", label.replace(/^.*→\s*/, "")));
        r.append(a);
      }
      table.append(r);
    }
    return section("🚉", "Stations", table);
  }

  function contactsView(data) {
    return (data.contacts || []).map((g) => {
      const cards = el("div", "cards");
      for (const c of g.items) {
        const card = el("div", "card");
        const links = el("div", "links");
        if (c.phone) links.append(button({ type: "call", url: "tel:" + tel(c.phone) }, "Call " + c.name));
        if (c.phone && c.text) links.append(button({ type: "text", url: "sms:" + tel(c.phone) }, "Text " + c.name));
        if (c.email) links.append(button({ type: "email", url: "mailto:" + c.email }, "Email " + c.name));
        for (const l of c.links || []) links.append(button(l, l.label));
        card.append(cardHead(c.icon, c.name, c.phone), links);
        cards.append(card);
      }
      return section(g.icon, g.title, cards);
    });
  }

  function linksView(data) {
    const cards = el("div", "cards");
    for (const o of data.other || []) {
      const a = button({ type: "link", url: o.url }, o.label);
      a.classList.add("tile");
      a.replaceChildren(el("span", "mark", o.icon || "🔗"), el("span", "", o.label));
      cards.append(a);
    }
    return section("🔗", "Links", cards);
  }

  function render(d) {
    root.replaceChildren(stationsView(d), ...contactsView(d), linksView(d));
    const jump = document.getElementById("jump");
    jump.replaceChildren(...[...root.querySelectorAll(".group")].map((g) => {
      const a = el("a");
      a.href = "#" + g.id;
      if (g.dataset.icon) a.append(el("span", "", g.dataset.icon));
      a.append(g.dataset.title);
      a.addEventListener("click", (e) => { e.preventDefault(); g.scrollIntoView({ behavior: "smooth" }); });
      return a;
    }));
    jump.hidden = false;
    renderQuick();
  }

  // Quick links: starred buttons always show, and the most-used ones fill the rest.
  // Counts and stars are kept on this phone only.
  const QUICK_STORE = "quick-links";
  const QUICK_SLOTS = 4;
  const quick = document.getElementById("quick");
  let usage = {};
  try { usage = JSON.parse(localStorage.getItem(QUICK_STORE)) || {}; } catch (e) {}
  const saveUsage = () => { try { localStorage.setItem(QUICK_STORE, JSON.stringify(usage)); } catch (e) {} };
  let pinning = false;

  let open = false;

  function renderQuick() {
    const onPage = new Map([...root.querySelectorAll("a.btn")].map((a) => [a.getAttribute("href"), a]));
    for (const a of onPage.values()) a.classList.toggle("pinned", !!usage[a.getAttribute("href")]?.pinned);
    const known = Object.entries(usage).filter(([url]) => onPage.has(url));
    const pinned = known.filter(([, u]) => u.pinned);
    const used = known.filter(([, u]) => !u.pinned && u.count > 0)
      .sort((a, b) => b[1].count - a[1].count || b[1].last - a[1].last)
      .slice(0, Math.max(0, QUICK_SLOTS - pinned.length));
    const parts = [];
    if (pinning) {
      parts.push(el("p", "pin-help", "Tap any button to star or unstar it. Starred links show first."));
    } else if (open) {
      const sheet = el("div", "sheet");
      sheet.append(el("h3", "", "Quick links"));
      // Starred first, then most-used.
      for (const [url, u] of [...pinned, ...used]) {
        const src = onPage.get(url);
        const a = button({ type: src.dataset.type, url, label: src.dataset.quick }, src.dataset.quick);
        if (u.pinned) a.append(el("span", "star", "★"));
        sheet.append(a);
      }
      if (!pinned.length && !used.length) sheet.append(el("p", "note", "Nothing here yet. Star the links you want, and the ones you use most will appear here too."));
      const star = el("button", "star-mode", "☆ Star links");
      star.type = "button";
      star.addEventListener("click", () => setPinning(true));
      sheet.append(star);
      parts.push(sheet);
    }
    const fab = el("button", pinning ? "fab done" : "fab", pinning ? "Done" : open ? "✕" : "★");
    fab.type = "button";
    fab.setAttribute("aria-label", pinning ? "Done starring" : open ? "Close quick links" : "Open quick links");
    fab.setAttribute("aria-expanded", String(open));
    fab.addEventListener("click", () => { if (pinning) setPinning(false); else { open = !open; renderQuick(); } });
    parts.push(fab);
    quick.replaceChildren(...parts);
    quick.hidden = false;
  }

  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && (open || pinning)) setPinning(false); });
  document.addEventListener("pointerdown", (e) => { if (open && !quick.contains(e.target)) { open = false; renderQuick(); } });

  function setPinning(on) {
    pinning = on;
    open = false;
    document.body.classList.toggle("pinning", on);
    renderQuick();
  }

  document.addEventListener("click", (e) => {
    const a = e.target.closest("a.btn");
    if (!a) return;
    const url = a.getAttribute("href");
    const u = usage[url] || (usage[url] = { count: 0, last: 0 });
    if (pinning) {
      e.preventDefault();
      if (quick.contains(a)) return;
      u.pinned = !u.pinned;
    } else {
      u.count += 1;
      u.last = Date.now();
    }
    saveUsage();
    renderQuick();
  });


  // links.enc.json is encrypted with a password (see tools/encrypt.mjs). The password is asked
  // once per phone; after that the unlocked key is kept on the phone so the page opens straight away.
  const KEY_STORE = "shortcuts-key";
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  let key = null;
  let shown = "";

  async function decrypt(file, k) {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(file.iv) }, k, unb64(file.data));
    return new TextDecoder().decode(plain);
  }

  async function keyFromPassword(password, file) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", hash: "SHA-256", salt: unb64(file.salt), iterations: file.iterations },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]
    );
  }

  async function savedKey() {
    try {
      const raw = localStorage.getItem(KEY_STORE);
      if (raw) return await crypto.subtle.importKey("raw", unb64(raw), "AES-GCM", true, ["decrypt"]);
    } catch (e) {}
    return null;
  }

  async function show(file) {
    const text = await decrypt(file, key);
    if (text === shown) return;
    shown = text;
    render(JSON.parse(text));
  }

  function askPassword(file, wrong) {
    const form = el("form", "unlock");
    const label = el("label", "", "Password");
    label.htmlFor = "password";
    const input = el("input");
    input.type = "password";
    input.id = "password";
    input.autocomplete = "current-password";
    input.required = true;
    const go = el("button", "", "Unlock");
    go.type = "submit";
    const msg = el("p", "note", wrong ? "That password didn't work. Try again." : "Enter the password once to unlock this phone.");
    form.append(label, input, go, msg);
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      go.disabled = true;
      msg.textContent = "Unlocking…";
      try {
        const k = await keyFromPassword(input.value, file);
        await decrypt(file, k);
        key = k;
        try { localStorage.setItem(KEY_STORE, b64(await crypto.subtle.exportKey("raw", k))); } catch (e) {}
        await show(file);
        refresh();
      } catch (err) {
        askPassword(file, true);
      }
    });
    root.replaceChildren(form);
    input.focus();
  }

  const load = (url) => fetch(url).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });

  // After showing the saved copy, check for changes and redraw if there are any.
  function refresh() {
    load("links.enc.json?fresh=" + Date.now())
      .then((file) => show(file).catch(() => { key = null; askPassword(file, false); }))
      .catch(() => {});
  }

  (async () => {
    let file;
    try { file = await load("links.enc.json"); }
    catch (e) { root.replaceChildren(el("p", "note", "Couldn't load the links. Check your connection and refresh.")); return; }
    key = await savedKey();
    if (!key) return askPassword(file, false);
    try { await show(file); refresh(); }
    catch (e) { key = null; askPassword(file, false); }
  })();

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
