<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f151c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Shortcuts">
<title>Work Shortcuts</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b5cad'/%3E%3Cpath d='M18 46h28M24 46l4-28h8l4 28M27 30h10' stroke='white' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Layout: one scrolling page (Stations, Contacts, Links); stations and contacts are full-width rows with colour-coded buttons on the right */
  :root {
    --bg: #f3f5f8;
    --surface: #ffffff;
    --fg: #16202c;
    --muted: #5b6878;
    --line: #d9dfe7;
    --accent: #0b5cad;
    --dep: #0b5cad;   --dep-bg: #e6f0fb;
    --map: #1f7a3f;   --map-bg: #e5f4ea;
    --board: #9a5b00; --board-bg: #fdf1dc;
    --tl: #a3195b;    --tl-bg: #fbe6f0;
    --link: #4a5565;  --link-bg: #eef1f5;
    --call: #0f766e;  --call-bg: #e0f3f1;
    --mail: #6d3fc0;  --mail-bg: #efe8fb;
    --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f151c; --surface: #18212b; --fg: #e6ecf2; --muted: #93a1b2; --line: #2a3644; --accent: #6fb1f5;
      --dep: #8cc2fa;   --dep-bg: #17304a;
      --map: #7fd69c;   --map-bg: #173826;
      --board: #f5c46b; --board-bg: #3a2c12;
      --tl: #f59ac4;    --tl-bg: #3d1a2b;
      --link: #c3cdd8;  --link-bg: #243140;
      --call: #6fd6c8;  --call-bg: #133532;
      --mail: #c4a8f5;  --mail-bg: #2c2142;
      color-scheme: dark;
    }
  }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 15px; line-height: 1.3;
  }
  .wrap {
    max-width: 760px; margin: 0 auto;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 14px;
  }
  h1 { margin: 0; font-size: 1.2rem; }
  h2 { margin: 0; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  #main { display: flex; flex-direction: column; gap: 14px; }
  .stations { display: flex; flex-direction: column; gap: 6px; }
  .station {
    display: flex; align-items: center; gap: 10px; min-width: 0;
    padding: 8px 8px 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  }
  .name { flex: none; width: 6.6em; display: flex; flex-direction: column; }
  .name strong { font-size: 0.98rem; }
  .code { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.06em; color: var(--muted); }
  .links { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  a.btn {
    display: inline-flex; align-items: center; gap: 5px; min-height: 36px; padding: 0 10px;
    border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 0.85rem; white-space: nowrap;
    color: var(--c); background: var(--cb); border: 1px solid transparent;
  }
  a.btn:hover { border-color: var(--c); }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  a.btn svg { width: 16px; height: 16px; flex: none; }
  .t-departures { --c: var(--dep); --cb: var(--dep-bg); }
  .t-map { --c: var(--map); --cb: var(--map-bg); }
  .t-board { --c: var(--board); --cb: var(--board-bg); }
  .t-thameslink { --c: var(--tl); --cb: var(--tl-bg); }
  .t-link { --c: var(--link); --cb: var(--link-bg); }
  .t-call, .t-text { --c: var(--call); --cb: var(--call-bg); }
  .t-email { --c: var(--mail); --cb: var(--mail-bg); }
  .other { display: flex; flex-wrap: wrap; gap: 6px; }
  .group { display: flex; flex-direction: column; gap: 6px; }
  .contact .name { width: auto; flex: 1; min-width: 0; }
  .contact .name strong { font-size: 0.92rem; }
  .contact .code { overflow-wrap: anywhere; }
  .contact .links { flex: none; justify-content: flex-end; }
  .note { margin: 0; color: var(--muted); }
  .unlock { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; max-width: 360px; }
  .unlock label { width: 100%; font-weight: 700; }
  .unlock input {
    flex: 1; min-width: 0; font: inherit; min-height: 40px; padding: 0 10px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg);
  }
  .unlock button {
    font: inherit; font-weight: 700; min-height: 40px; padding: 0 16px; cursor: pointer;
    border: 0; border-radius: 8px; background: var(--accent); color: var(--bg);
  }
  .unlock input:focus-visible, .unlock button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .unlock .note { width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Work Shortcuts</h1>
  <main id="main"><p class="note">Loading…</p></main>
</div>

<script>
  // Stations, contacts and links come from links.enc.json. Links open in the same tab, so Back returns here.
  const root = document.getElementById("main");

  // Each link "type" gets its own colour, icon and default label.
  const TYPES = {
    departures: { label: "Departures", icon: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>' },
    map: { label: "Map", icon: '<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>' },
    board: { label: "Board", icon: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h10M7 14h6"/>' },
    thameslink: { label: "Thameslink", icon: '<path d="M5 12h14M13 6l6 6-6 6"/>' },
    call: { label: "Call", icon: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>' },
    text: { label: "Text", icon: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>' },
    email: { label: "Email", icon: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>' },
    link: { label: "Link", icon: '<path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1"/><path d="M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/>' },
  };

  function el(tag, className, text) {
    const n = document.createElement(tag);
    if (className) n.className = className;
    if (text) n.textContent = text;
    return n;
  }

  function button(link) {
    const type = TYPES[link.type] ? link.type : "link";
    const a = el("a", "btn t-" + type);
    a.href = link.url;
    a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + TYPES[type].icon + "</svg>";
    a.append(link.label || TYPES[type].label);
    return a;
  }

  const tel = (n) => n.replace(/[^0-9+]/g, "");

  function rows(items, makeRow) {
    const box = el("div", "stations");
    box.append(...items.map(makeRow));
    return box;
  }

  function stationsView(data) {
    return [rows(data.locations || [], (loc) => {
      const panel = el("section", "station");
      const name = el("div", "name");
      name.append(el("strong", "", loc.name));
      if (loc.code) name.append(el("span", "code", loc.code));
      const links = el("div", "links");
      links.append(...loc.links.map(button));
      panel.append(name, links);
      return panel;
    })];
  }

  function contactsView(data) {
    return (data.contacts || []).map((g) => {
      const group = el("div", "group");
      group.append(el("h2", "", g.title), rows(g.items, (c) => {
        const row = el("section", "station contact");
        const name = el("div", "name");
        name.append(el("strong", "", c.name));
        if (c.phone) name.append(el("span", "code", c.phone));
        if (c.email) name.append(el("span", "code", c.email));
        const links = el("div", "links");
        if (c.phone) links.append(button({ type: "call", url: "tel:" + tel(c.phone) }));
        if (c.phone && c.text) links.append(button({ type: "text", url: "sms:" + tel(c.phone) }));
        if (c.email) links.append(button({ type: "email", url: "mailto:" + c.email }));
        row.append(name, links);
        return row;
      }));
      return group;
    });
  }

  function linksView(data) {
    const other = el("div", "other");
    other.append(...(data.other || []).map(button));
    return [other];
  }

  function render(d) {
    const heading = (t) => el("h2", "", t);
    root.replaceChildren(
      heading("Stations"), ...stationsView(d),
      ...contactsView(d),
      heading("Links"), ...linksView(d)
    );
  }

  // links.enc.json is encrypted with a password (see tools/encrypt.mjs). The password is asked
  // once per phone; after that the unlocked key is kept on the phone so the page opens straight away.
  const KEY_STORE = "shortcuts-key";
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  let key = null;
  let shown = "";

  async function decrypt(file, k) {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(file.iv) }, k, unb64(file.data));
    return new TextDecoder().decode(plain);
  }

  async function keyFromPassword(password, file) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", hash: "SHA-256", salt: unb64(file.salt), iterations: file.iterations },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]
    );
  }

  async function savedKey() {
    try {
      const raw = localStorage.getItem(KEY_STORE);
      if (raw) return await crypto.subtle.importKey("raw", unb64(raw), "AES-GCM", true, ["decrypt"]);
    } catch (e) {}
    return null;
  }

  async function show(file) {
    const text = await decrypt(file, key);
    if (text === shown) return;
    shown = text;
    render(JSON.parse(text));
  }

  function askPassword(file, wrong) {
    const form = el("form", "unlock");
    const label = el("label", "", "Password");
    label.htmlFor = "password";
    const input = el("input");
    input.type = "password";
    input.id = "password";
    input.autocomplete = "current-password";
    input.required = true;
    const go = el("button", "", "Unlock");
    go.type = "submit";
    const msg = el("p", "note", wrong ? "That password didn't work. Try again." : "Enter the password once to unlock this phone.");
    form.append(label, input, go, msg);
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      go.disabled = true;
      msg.textContent = "Unlocking…";
      try {
        const k = await keyFromPassword(input.value, file);
        await decrypt(file, k);
        key = k;
        try { localStorage.setItem(KEY_STORE, b64(await crypto.subtle.exportKey("raw", k))); } catch (e) {}
        await show(file);
        refresh();
      } catch (err) {
        askPassword(file, true);
      }
    });
    root.replaceChildren(form);
    input.focus();
  }

  const load = (url) => fetch(url).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });

  // After showing the saved copy, check for changes and redraw if there are any.
  function refresh() {
    load("links.enc.json?fresh=" + Date.now())
      .then((file) => show(file).catch(() => { key = null; askPassword(file, false); }))
      .catch(() => {});
  }

  (async () => {
    let file;
    try { file = await load("links.enc.json"); }
    catch (e) { root.replaceChildren(el("p", "note", "Couldn't load the links. Check your connection and refresh.")); return; }
    key = await savedKey();
    if (!key) return askPassword(file, false);
    try { await show(file); refresh(); }
    catch (e) { key = null; askPassword(file, false); }
  })();

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
